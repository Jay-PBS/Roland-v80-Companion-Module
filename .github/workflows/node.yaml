name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

# The job only ever reads the tree - it builds, lints and format-checks, and publishes
# nothing. Without this the job inherits the repository default token scope, which for a
# push-triggered run can still be read/write.
permissions:
  contents: read

# A run is only ever interesting for the tip of a branch, so drop superseded ones rather
# than queueing a run per push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        # Matches the runtime declared in companion/manifest.json. Local development
        # currently runs Node 24, so this job is the only check that the module still
        # builds on the version Companion actually ships.
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Prepare Environment
        run: |
          corepack enable
      - name: Prepare module
        # Fail rather than silently resolve a lockfile that does not match package.json.
        # Yarn already infers this from CI=true below, so the flag changes no behaviour
        # here - it states the requirement rather than leaving it to an env var.
        run: |
          yarn install --immutable
        env:
          CI: true
      - name: Build and check types
        run: |
          yarn build
        env:
          CI: true
      - name: Run lint
        run: |
          yarn lint
        env:
          CI: true
      - name: Check formatting
        run: |
          yarn prettier --check .
        env:
          CI: true
